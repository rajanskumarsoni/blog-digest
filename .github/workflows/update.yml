name: Update blog feed

on:
  schedule:
    - cron: '30 1 * * *'   # daily at 01:30 UTC (7:00 AM IST)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    paths: ['feeds.json', 'scripts/**']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/build.mjs
      - name: Commit updated posts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --staged --quiet || git commit -m "Update posts $(date -u +%F)"
          git push
